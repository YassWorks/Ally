[project]
name = "ally"
version = "0.8.0"
description = "A private, provider-agnostic AI agent for your terminal: chat with tools, local RAG, and project generation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Yassine Kallel" }]
requires-python = ">=3.11"
keywords = ["ai", "agent", "cli", "llm", "langgraph", "rag", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "charset-normalizer==3.4.4",
    "chromadb==1.4.0",
    "langchain-anthropic==1.3.0",
    "langchain-cerebras==0.8.2",
    "langchain-core==1.2.7",
    "langchain-google-genai==4.1.2",
    "langchain-groq==1.1.1",
    "langchain-ollama==1.0.1",
    "langchain-openai==1.1.7",
    "langgraph-checkpoint-sqlite==3.0.1",
    "langgraph==1.0.9",
    "lxml==6.0.2",
    "ollama==0.6.1",
    "openai==2.14.0",
    "prompt-toolkit==3.0.52",
    "pymupdf-layout==1.26.6",
    "pymupdf4llm==0.2.7",
    "python-docx==1.2.0",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.3",
    "requests==2.32.5",
    "rich==14.2.0",
]

[project.optional-dependencies]
hf = [
    "hf-xet==1.2.0",
    "torch==2.9.1",
    "transformers==4.57.3",
]

[project.urls]
Homepage = "https://github.com/YassWorks/Ally"
Issues = "https://github.com/YassWorks/Ally/issues"
Docker = "https://hub.docker.com/r/yassw0rks/ally"

[project.scripts]
ally = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
