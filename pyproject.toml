[project]
name = "ally"
version = "0.8.0"
description = "A private, provider-agnostic AI agent for your terminal: chat with tools, local RAG, and project generation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Yassine Kallel" }]
requires-python = ">=3.11"
keywords = ["ai", "agent", "cli", "llm", "langgraph", "rag", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4==4.15.0",
    "charset-normalizer==3.5.2",
    "chromadb==1.5.9",
    "ddgs==9.16.1",
    "langchain-anthropic==1.7.9",
    "langchain-cerebras==0.8.2",
    "langchain-core==1.7.4",
    "langchain-google-genai==4.4.2",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.3",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph==1.2.19",
    "lxml==6.1.3",
    "ollama==0.6.3",
    "openai==3.44.0",
    "prompt-toolkit==3.0.53",
    "pymupdf-layout==2.1",
    "pymupdf4llm==2.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
    "rich==15.0.0",
]

[project.optional-dependencies]
hf = [
    "hf-xet==1.8.0",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[project.urls]
Homepage = "https://github.com/YassWorks/Ally"
Issues = "https://github.com/YassWorks/Ally/issues"
Docker = "https://hub.docker.com/r/yassw0rks/ally"

[project.scripts]
ally = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
