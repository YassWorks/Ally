name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ally with ...
        2. Type ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ally version
      description: The output of `ally --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Docker
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: ollama, qwen3
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The matching lines from the log file. Remove anything private first.
      render: text
